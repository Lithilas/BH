<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F5F7">
    <title>Sukurti žaidimą · Bounty Hunter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #F4F5F7; --surface: #FFFFFF; --line: #D9DCE2; --line-strong: #C3C8D1;
            --ink: #14171C; --muted: #5B6270;
            --red: #D92D27; --red-ink: #B3211C; --blue: #1F5FD6; --gray-dot: #9AA1AE;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Barlow', system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 28px 16px 64px; font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 6px; background: var(--ink); z-index: 5; }
        .wrap { max-width: 560px; margin: 0 auto; }
        .hidden { display: none !important; }
        h1 { font: 700 2.5rem/1.05 'Barlow Condensed', sans-serif; margin: 0 0 4px; }
        h3 { font-size: .95rem; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
        .muted { color: var(--muted); } .small { font-size: .85rem; }
        :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
        label { display: block; font-weight: 600; margin: 14px 0 4px; }
        label:first-of-type { margin-top: 0; }
        input[type="text"] { width: 100%; padding: 12px; font: 600 1.05rem 'Barlow', sans-serif; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; }
        .btn { min-height: 52px; padding: 10px 18px; font: 600 1.05rem 'Barlow', sans-serif; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; width: 100%; margin-top: 12px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn:active { transform: scale(.985); } .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
        .btn-sm { min-height: 44px; padding: 8px 14px; margin-top: 0; width: auto; flex: 1 1 0; }
        details { margin-top: 14px; }
        details summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }

        .code { font: 700 clamp(1.7rem, 8vw, 2.3rem)/1 'Barlow Condensed', sans-serif; letter-spacing: .06em; white-space: nowrap; }
        .keybox { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
        .keybox:first-of-type { border-top: 0; padding-top: 0; }
        .warn { background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 16px; margin-top: 14px; font-weight: 600; }
        .link { padding: 12px 0; border-top: 1px solid var(--line); }
        .link-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
        .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--gray-dot); flex-shrink: 0; }
        .dot.red { background: var(--red); } .dot.blue { background: var(--blue); } .dot.ink { background: var(--ink); }
        .role { font: 700 1.5rem/1.1 'Barlow Condensed', sans-serif; flex: 1 1 calc(100% - 30px); }
        .url { display: block; margin-top: 8px; font: 400 .82rem/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); word-break: break-all; }
        .qr { margin-top: 10px; background: #fff; padding: 10px; display: inline-block; border: 1px solid var(--line); border-radius: 12px; }
        #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(140px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 12px; z-index: 10; opacity: 0; transition: .3s; pointer-events: none; font-weight: 600; max-width: 90%; text-align: center; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; } #toast.err { background: var(--red-ink); }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Sukurti žaidimą</h1>
    <p class="muted">Bounty Hunter žaidimo kambarys su savo kodu ir savo žaidimo vedėjo kodu. Duomenys nesimaišo su kitų organizatorių žaidimais.</p>

    <div id="form" class="card">
        <label for="evname">Renginio pavadinimas (nebūtina)</label>
        <input type="text" id="evname" maxlength="60" placeholder="Pvz. Šeštadienio žaidimas" autocomplete="off">
        <details>
            <summary>Papildomi nustatymai</summary>
            <label for="ccode">Žaidimo kodas (5–8 raidės ar skaičiai)</label>
            <input type="text" id="ccode" maxlength="8" placeholder="Palikite tuščią – sugeneruosime" autocomplete="off" autocapitalize="characters">
            <label for="ckey">GM kodas (6–12 raidžių ar skaičių)</label>
            <input type="text" id="ckey" maxlength="12" placeholder="Palikite tuščią – sugeneruosime" autocomplete="off" autocapitalize="characters">
        </details>
        <button id="create" class="btn btn-primary" onclick="createRoom()">Sukurti žaidimą</button>
    </div>

    <div id="result" class="hidden">
        <div class="card">
            <div class="keybox"><div><h3>Žaidimo kodas</h3><div class="code" id="r-code"></div></div><button class="btn btn-sm" style="flex:0 0 auto;" onclick="copyText(document.getElementById('r-code').textContent)">Kopijuoti</button></div>
            <div class="keybox"><div><h3>GM kodas (tik vedėjui)</h3><div class="code" id="r-key"></div></div><button class="btn btn-sm" style="flex:0 0 auto;" onclick="copyText(document.getElementById('r-key').dataset.raw)">Kopijuoti</button></div>
            <div class="warn">Išsaugokite GM kodą dabar. Vėliau jo atkurti negalima.</div>
        </div>
        <div class="card" id="r-links"></div>
        <button class="btn" onclick="copyAll()">Kopijuoti visas žaidėjų nuorodas</button>
    </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB1aSPG4BKYghWw2KKq_Ri4oqRbDeh4t_8",
        authDomain: "lithilas-bh.firebaseapp.com",
        databaseURL: "https://lithilas-bh-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "lithilas-bh",
        storageBucket: "lithilas-bh.firebasestorage.app",
        messagingSenderId: "971183564853",
        appId: "1:971183564853:web:2772ee6826ba1fa54d297c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const $ = id => document.getElementById(id);
    const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // be painiojamų O/0, I/1
    const norm = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    function rand(n) {
        const a = new Uint32Array(n); crypto.getRandomValues(a);
        return Array.from(a, x => ALPHABET[x % ALPHABET.length]).join('');
    }
    let toastTimer;
    function toast(m, err) { const t = $('toast'); t.textContent = m; t.className = (err ? 'err ' : '') + 'show'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, 3500); }
    function copyText(text) {
        const done = () => toast('Nukopijuota');
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => toast('Nepavyko nukopijuoti', true));
        else { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Nepavyko nukopijuoti', true); } ta.remove(); }
    }

    let created = null;
    async function createRoom() {
        const btn = $('create'); btn.disabled = true; btn.textContent = 'Kuriama...';
        try {
            const cred = await firebase.auth().signInAnonymously();
            const uid = cred.user.uid;
            const customCode = norm($('ccode').value), customKey = norm($('ckey').value);
            if ($('ccode').value && (customCode.length < 5 || customCode.length > 8)) throw new Error('Žaidimo kodas turi būti 5–8 simbolių.');
            if ($('ckey').value && (customKey.length < 6 || customKey.length > 12)) throw new Error('GM kodas turi būti 6–12 simbolių.');
            const key = customKey || rand(8);
            let code = null;
            for (let i = 0; i < 6 && !code; i++) {
                const c = customCode || rand(6);
                try { await db.ref('rooms/' + c + '/private/gmKey').set(key); code = c; }          // pavyksta tik jei kambario dar nėra
                catch (e) { if (customCode) throw new Error('Kodas „' + c + '“ jau užimtas. Pasirinkite kitą.'); }
            }
            if (!code) throw new Error('Nepavyko sukurti kambario. Bandykite dar kartą.');
            await db.ref('rooms/' + code + '/gms/' + uid).set(key);                          // kūrėjas iškart tampa GM
            await db.ref('rooms/' + code + '/meta').set({ name: $('evname').value.trim(), createdAt: firebase.database.ServerValue.TIMESTAMP });
            created = { code, key };
            showResult();
        } catch (e) {
            console.error(e);
            toast(/permission/i.test(e.message) ? 'Nepavyko: patikrinkite Firebase taisykles ir Anonymous prisijungimą.' : e.message, true);
            btn.disabled = false; btn.textContent = 'Sukurti žaidimą';
        }
    }

    function gameBase() { return new URL('./', location.href).href; }
    function linkOf(role) { return gameBase() + '?room=' + created.code + '&role=' + role; }
    const LINKS = [
        { label: 'Raudona komanda', role: 'RAUDONA', dot: 'red' },
        { label: 'Mėlyna komanda', role: 'MELYNA', dot: 'blue' },
        { label: 'Žaidimo vedėjas (GM)', role: 'GM', dot: 'ink' }
    ];
    function showResult() {
        $('form').classList.add('hidden'); $('result').classList.remove('hidden');
        $('r-code').textContent = created.code;
        $('r-key').textContent = created.key.slice(0, 4) + '-' + created.key.slice(4); $('r-key').dataset.raw = created.key;
        const hasQr = typeof QRCode !== 'undefined';
        $('r-links').innerHTML = '<h3>Nuorodos</h3>' + LINKS.map((l, i) => `
            <div class="link">
                <div class="link-top"><i class="dot ${l.dot}"></i><span class="role">${l.label}</span>
                    <button class="btn btn-sm" onclick="copyText(linkOf('${l.role}'))">Kopijuoti</button>
                    <a class="btn btn-sm" href="${linkOf(l.role)}" target="_blank" rel="noopener">Atidaryti</a>
                    ${hasQr ? `<button class="btn btn-sm" onclick="toggleQr(${i})">QR</button>` : ''}</div>
                <span class="url">${linkOf(l.role)}</span>
                <div id="qr-${i}" class="qr hidden"></div>
            </div>`).join('');
    }
    function toggleQr(i) {
        const box = $('qr-' + i);
        if (!box.firstChild) new QRCode(box, { text: linkOf(LINKS[i].role), width: 180, height: 180 });
        box.classList.toggle('hidden');
    }
    function copyAll() {
        copyText(LINKS.filter(l => l.role !== 'GM').map(l => `${l.label}: ${linkOf(l.role)}`).join('\n'));
    }
</script>
</body>
</html>
